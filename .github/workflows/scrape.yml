name: CGTrader scrape

# Runs every 6 hours, unattended, forever, for free (public repo = unlimited
# Actions minutes and, importantly, no meaningful cap on CONCURRENT jobs
# either). Each run scrapes up to 8 categories IN PARALLEL, one per throwaway
# Linux VM -- previously this was one category at a time sequentially, which
# meant finishing all 19 categories was projected at ~5+ weeks even after
# fixing the push-race bug. Running 8-wide cuts that to roughly a week,
# because wall-clock time to finish is what the parallelism buys back (the
# work itself, and its cost, is unchanged -- we're not paying per-minute).
#
# Each category job resumes exactly where it left off via the resumable
# jsonl/state files already used for local runs; nothing here bypasses that,
# it just decides how many categories run at once and how long each gets.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to git-commit progress back to the repo
  issues: write      # needed to open the "all categories complete" issue

jobs:
  scrape:
    strategy:
      fail-fast: false   # one category's runner having a bad day must never
      # cancel the other 7 -- they're fully independent
      max-parallel: 8   # conservative starting point (not the full 18) so we
      # can watch WAF behavior under real parallel load before pushing wider
      matrix:
        category:
          - electronics
          - household
          - science
          - space
          - sport
          - vehicle
          - watercraft
          - plant
          - aircraft
          - industrial
          - food
          - military
          - car
          - interior
          - animal
          - character
          - architectural
          - exterior
        # "award" is deliberately excluded -- already fully scraped
        # (9,960/9,960).

    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's own hard cap is 360; this leaves a
    # margin so the job is stopped by the detail scraper's own internal
    # watchdog rather than abruptly killed by GitHub mid-commit.

    concurrency:
      # Scoped PER CATEGORY: two runners both scraping "aircraft" at once
      # would race on the same shard files, but "aircraft" and "food"
      # running simultaneously are entirely independent and should NOT
      # queue behind each other. This is what actually enables the 8-way
      # speedup -- a single shared group here would serialize everything
      # right back to one-at-a-time regardless of max-parallel.
      group: cgtrader-scrape-${{ matrix.category }}
      cancel-in-progress: false

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not the default shallow clone --
          # the commit step's rebase-and-retry-on-push-rejection needs a real
          # common ancestor with origin/main to rebase onto.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium (for solving the WAF challenge)
        run: playwright install --with-deps chromium

      - name: Backfill missing sale/discount fields for ${{ matrix.category }}
        run: |
          # Rows scraped before the /products/<slug>.js endpoint was fully
          # parsed have no price_final / sale_discount_pct / downloads_count.
          # 'award' is the big one (9,760 of its 9,960 rows) because it was
          # scraped first, but any category can pick up a few such rows.
          # --patch-views only touches rows still missing price_final and
          # rewrites shards atomically, so this is a no-op (exits in seconds)
          # once a category is fully backfilled -- safe to run every time.
          # Budgeted well under the scrape step so it can't starve it.
          python cgtrader_detail_scrape.py \
            --category "${{ matrix.category }}" \
            --patch-views --max-stall-min 10 --max-minutes 100

      - name: Scrape ${{ matrix.category }} in chunks, committing after each
        run: |
          # Scrape in ~45min chunks, pushing after every one, instead of one
          # 200min block pushed only at the end. Four separate failure modes
          # have each destroyed a whole run's work precisely because the only
          # copy lived on the runner until the very last step (see
          # commit_progress.sh header). The latest was 2026-08-15: the runner
          # itself died 1h50m into 'architectural' -- the scrape step was left
          # "in_progress", the job was marked failure, and the commit step
          # never ran. Chunking bounds the loss from ANY such death to one
          # chunk, and costs nothing but a few extra commits.
          #
          # Total scrape budget stays 200min so the arithmetic against the
          # job's timeout-minutes: 350 is unchanged:
          #   100 (backfill) + 200 (scrape) + ~50 headroom < 350
          set -u
          CHUNK_MIN=45
          TOTAL_MIN=200
          deadline=$(( $(date +%s) + TOTAL_MIN * 60 ))

          chunk_no=0
          while :; do
            now=$(date +%s)
            left_min=$(( (deadline - now) / 60 ))
            if [ "$left_min" -lt 5 ]; then
              echo "[chunk] scrape budget exhausted"
              break
            fi
            this_chunk=$CHUNK_MIN
            [ "$left_min" -lt "$CHUNK_MIN" ] && this_chunk=$left_min

            chunk_no=$(( chunk_no + 1 ))
            echo "::group::chunk $chunk_no (${this_chunk}min, ${left_min}min left)"
            python cgtrader_detail_scrape.py \
              --category "${{ matrix.category }}" \
              --order price_desc --delay 1.5 \
              --max-stall-min 10 --max-minutes "$this_chunk"
            rc=$?
            echo "::endgroup::"

            # Push what this chunk got regardless of how python exited -- a
            # non-zero rc still leaves durable rows in the shards.
            bash commit_progress.sh "${{ matrix.category }}"

            if [ "$rc" -ne 0 ]; then
              echo "::warning::scraper exited $rc on chunk $chunk_no; progress pushed, stopping this job"
              exit "$rc"
            fi

            # The scraper prints this only when it ran out of models to fetch,
            # which is our signal the category is done rather than merely
            # out of time for this chunk.
            if [ -f .scrape_category_complete ]; then
              echo "[chunk] ${{ matrix.category }} has no models left to fetch"
              rm -f .scrape_category_complete
              break
            fi
          done

      - name: Export this category's CSV
        if: always()
        run: python cgtrader_detail_scrape.py --category "${{ matrix.category }}" --export

      - name: Upload ${{ matrix.category }} CSV export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.category }}-${{ github.run_number }}
          path: cgtrader_details/${{ matrix.category }}_details_*.csv
          if-no-files-found: warn
          retention-days: 90

  check-completion:
    needs: scrape
    if: always()   # still check even if some matrix legs failed -- partial
    # progress is still worth reporting, and this must not silently stop
    # running just because one category had a rough run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repo (latest, after all category pushes)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute overall progress
        id: progress
        run: python check_completion.py

      - name: Open the "all done" issue, once
        if: steps.progress.outputs.complete == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "All 19 categories complete";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "scrape-complete",
            });
            if (existing.length > 0) {
              console.log("Completion issue already exists, not opening another.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["scrape-complete"],
              body: [
                "Every category has reached 100% (or its models are confirmed",
                "permanently unavailable on CGTrader).",
                "",
                `**${{ steps.progress.outputs.total_done }} / ${{ steps.progress.outputs.total_target }}** models (${{ steps.progress.outputs.overall_pct }}%)`,
                "",
                "${{ steps.progress.outputs.table }}",
                "",
                "The scheduled workflow will keep running every 6h (harmless,",
                "each run finishes in well under a minute once there's nothing",
                "left to fetch) unless you disable it from the Actions tab.",
              ].join("\n"),
            });
